# unbind C-b
# set -g prefix C-a
unbind C-a
set -g prefix C-b

unbind r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# tmux-256color knows italics/strikethrough that Pi and other TUIs use;
# screen-256color does not. Remote hosts lacking this terminfo entry can
# complain over ssh — run `TERM=xterm-256color ssh host` there if needed.
set -g default-terminal "tmux-256color"

# no longer necessary
# setw -g utf8 on
# set -g status-utf8 on

# set -g status-left "#h:[#S]"
# set -g status-left-length 50
# set -g status-right "%H:%M %d-%h-%Y"
#kset -g status-right-length 50
# setw -g window-status-current-format "|#I:#W|"

set -g bell-action any


set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# split keys
bind "'" split-window -h -c "#{pane_current_path}"
bind '/' split-window -v -c "#{pane_current_path}"

# mouse
set -g mouse on

# history limit (agents print a lot; this is per pane)
set -g history-limit 100000

# 1-indexed windows match the number keys; close gaps when a window dies
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# size windows to the smallest client actually viewing them, not the session
set-window-option -g aggressive-resize on


# copy-paste with Terminal
# bind-key -T copy-mode MouseDragEnd1Pane copy-pipe 'pbcopy'

# Suggested by neovim
set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-features ',xterm-kitty:RGB:extkeys'

# For enter key modification to work
set -s extended-keys always
set -s extended-keys-format csi-u

# Force newline bytes through tmux for Pi/TUI editors.
bind-key -n S-Enter send-keys -H 0a
bind-key -n C-j send-keys -H 0a

# Pi agent state. ~/.pi/agent/extensions/tmux-state.ts sets the pane option
# @pi to ○ idle, ● working, ⏸ waiting on you, ✓ finished; #{P:} joins the
# glyphs of every pane in a window, #{S:#{W:#{P:}}} of every pane anywhere.
set -g status-interval 5
set -g window-status-format '#I:#{?#{P:#{@pi}},#{P:#{@pi}} ,}#W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{?#{P:#{@pi}},#{P:#{@pi}} ,}#W#{?window_flags,#{window_flags}, }'
set -g status-right-length 80
set -g status-right '#{?#{S:#{W:#{P:#{@pi}}}},pi #{S:#{W:#{P:#{@pi}}}} | ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

# prefix P: fzf over Pi panes, waiting ones first, with a live preview
bind P display-popup -E -w 80% -h 70% -T ' pi agents ' "$HOME/.local/bin/tmux-pi-pick"

# prefix H: toggle a raw log of the current pane (escape codes included)
bind H pipe-pane -o "mkdir -p ~/.local/state/tmux-logs && cat >> ~/.local/state/tmux-logs/#{session_name}-#{window_name}-#{pane_id}.log" \; display-message "#{?pane_pipe,logging to ~/.local/state/tmux-logs,logging stopped}"
